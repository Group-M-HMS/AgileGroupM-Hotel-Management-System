name: CI/CD

on:
  pull_request:
    branches: [develop, main, frontend, backend]
  push:
    branches: [develop, main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/group-m-hms/agilegroupm-hotel-management-system

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      room-service: ${{ steps.filter.outputs.room-service }}
      pricing-service: ${{ steps.filter.outputs.pricing-service }}
      user-service: ${{ steps.filter.outputs.user-service }}
      booking-service: ${{ steps.filter.outputs.booking-service }}
      payment-service: ${{ steps.filter.outputs.payment-service }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            room-service:
              - 'backend/room-service/**'
            pricing-service:
              - 'backend/pricing-service/**'
            user-service:
              - 'backend/user-service/**'
            booking-service:
              - 'backend/booking-service/**'
            payment-service:
              - 'backend/payment-service/**'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Dummy values so `getAuth()` doesn't throw during this build-sanity check — this
          # job never talks to Firebase, it just needs a non-empty apiKey to avoid a synchronous
          # auth/invalid-api-key crash while prerendering. Real values come from CI secrets via
          # build-and-push's build-args, same split as the dummy DB creds room-service/
          # pricing-service's CI jobs already use.
          NEXT_PUBLIC_FIREBASE_API_KEY: dummy-ci-build-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy-ci-build
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: dummy.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:0000000000:web:0000000000000000000000"

  room-service:
    needs: changes
    if: needs.changes.outputs.room-service == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hotel_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend/room-service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x ./mvnw
      - run: ./mvnw -B verify

  pricing-service:
    needs: changes
    if: needs.changes.outputs.pricing-service == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hms_user
          POSTGRES_PASSWORD: hms_password
          POSTGRES_DB: hms_pricing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend/pricing-service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: chmod +x ./mvnw
      - run: ./mvnw -B verify

  user-service:
    needs: changes
    if: needs.changes.outputs.user-service == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hotel_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend/user-service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x ./mvnw
      - run: ./mvnw -B verify

  booking-service:
    needs: changes
    if: needs.changes.outputs.booking-service == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hms_user
          POSTGRES_PASSWORD: hms_password
          POSTGRES_DB: hms_booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend/booking-service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x ./mvnw
      - run: ./mvnw -B verify

  payment-service:
    needs: changes
    if: needs.changes.outputs.payment-service == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hms_user
          POSTGRES_PASSWORD: hms_password
          POSTGRES_DB: hms_payment
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend/payment-service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x ./mvnw
      - run: ./mvnw -B verify

  ci-gate:
    needs: [changes, frontend, room-service, pricing-service, user-service, booking-service, payment-service]
    # Single required status check for branch protection: frontend/room-service/pricing-service
    # are skipped (not failed) when their paths didn't change, so a required check on any one
    # of them directly would leave PRs that don't touch that path waiting forever. This job
    # always runs and fails only on a real job failure, never on an upstream skip.
    #
    # The result check below reads `needs` dynamically (toJSON) instead of naming each job, so
    # adding a new job to the `needs:` list above is the only step required to bring it under
    # the gate — no second hardcoded list to keep in sync.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check CI job results
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          if jq -e '[.[].result] | all(. == "success" or . == "skipped")' needs.json > /dev/null; then
            echo "All CI jobs passed or were skipped."
          else
            echo "One or more required CI jobs did not pass:"
            jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "  \(.key): \(.value.result)"' needs.json
            exit 1
          fi

  build-and-push:
    # Depends on ci-gate rather than directly on [changes, frontend, room-service,
    # pricing-service] so there's one source of truth for "did the real work pass" instead of
    # duplicating that job list here. But GitHub's implicit success() (added automatically to
    # any `if` that doesn't call a status function) poisons on a skip *anywhere* in the full
    # transitive dependency chain, not just this job's direct needs — so depending on ci-gate
    # alone does NOT stop frontend/room-service/pricing-service's skips from propagating.
    # always() + an explicit check on ci-gate's own result is still required.
    # `changes` is added to needs (alongside ci-gate) so the per-image build step below can read
    # needs.changes.outputs[matrix.name] and skip images whose path didn't change on this push.
    # `changes` always runs (no `if`), so it never introduces a skip that would poison the gate.
    needs: [changes, ci-gate]
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.ci-gate.result == 'success'
    # Native arm64 runner (free for public repos) — builds arm64 images directly with no QEMU.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: frontend
            context: frontend
          - name: room-service
            context: backend/room-service
          - name: pricing-service
            context: backend/pricing-service
          - name: user-service
            context: backend/user-service
          - name: booking-service
            context: backend/booking-service
          - name: payment-service
            context: backend/payment-service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The VM (OCI-ARM) is arm64, so images must be built for arm64. This job runs on a native
      # arm64 runner (ubuntu-24.04-arm) and builds arm64 directly — no QEMU. Previously it built
      # arm64 on an amd64 runner under QEMU emulation, 5-10x slower for the JVM/npm builds.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        # Only (re)build an image whose own path changed on this push. `changes` keys match the
        # matrix names exactly (frontend, room-service, ...), so index its outputs by matrix.name.
        # Unchanged services keep their existing :latest image, which `docker compose pull` on the
        # VM re-pulls unchanged. This drops the previous "rebuild all 6 on every main push".
        if: needs.changes.outputs[matrix.name] == 'true'
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          # BuildKit layer cache across runs (GitHub Actions cache backend), scoped per image so
          # one service's layers never evict another's. mode=max caches intermediate build stages
          # too (the Maven dependency layer, npm ci) — the parts that dominate cold-build time.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # NEXT_PUBLIC_* vars are baked into the client bundle at build time, so the VM's
          # public address has to be supplied here — setting them in docker-compose's
          # environment: block at container start would have no effect. `secrets` isn't a
          # valid context inside strategy.matrix, so this has to live here instead of there.
          # room-service/pricing-service builds get these as empty/unused build-args, which
          # is harmless — their Dockerfiles don't declare matching ARGs.
          build-args: |
            NEXT_PUBLIC_ROOM_SERVICE_URL=${{ matrix.name == 'frontend' && format('http://{0}:8081', secrets.VM_HOST) || '' }}
            NEXT_PUBLIC_PRICING_SERVICE_URL=${{ matrix.name == 'frontend' && format('http://{0}:8083', secrets.VM_HOST) || '' }}
            NEXT_PUBLIC_USER_SERVICE_URL=${{ matrix.name == 'frontend' && format('http://{0}:8082', secrets.VM_HOST) || '' }}
            NEXT_PUBLIC_BOOKING_SERVICE_URL=${{ matrix.name == 'frontend' && format('http://{0}:8085', secrets.VM_HOST) || '' }}
            NEXT_PUBLIC_PAYMENT_SERVICE_URL=${{ matrix.name == 'frontend' && format('http://{0}:8084', secrets.VM_HOST) || '' }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ matrix.name == 'frontend' && secrets.STRIPE_PUBLISHABLE_KEY || '' }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ matrix.name == 'frontend' && secrets.FIREBASE_API_KEY || '' }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ matrix.name == 'frontend' && secrets.FIREBASE_AUTH_DOMAIN || '' }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ matrix.name == 'frontend' && secrets.FIREBASE_PROJECT_ID || '' }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ matrix.name == 'frontend' && secrets.FIREBASE_STORAGE_BUCKET || '' }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ matrix.name == 'frontend' && secrets.FIREBASE_MESSAGING_SENDER_ID || '' }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ matrix.name == 'frontend' && secrets.FIREBASE_APP_ID || '' }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest

  deploy:
    # Same reasoning as build-and-push above: this job's dependency chain transitively
    # includes ci-gate and the conditional frontend/room-service/pricing-service jobs, so a
    # bare `if` (implicit success()) still gets poisoned by their skips. always() + an
    # explicit check on this job's own direct need (build-and-push) is required.
    needs: build-and-push
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    # Never let two deploys touch the VM at once — a second push while a deploy is mid-pull
    # would race `docker compose up`. Queue instead of cancel: a half-finished deploy should
    # be allowed to complete rather than be interrupted.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # docker-compose.yml (and postgres-init) live on the VM as plain copied files, not a git
      # checkout — deploy previously only ran `docker compose pull && up -d` against whatever
      # was already there, so compose changes (e.g. the CORS_ALLOWED_ORIGIN passthrough) never
      # reached the VM without a manual scp. This keeps them in sync on every deploy.
      - uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          source: "docker-compose.yml,deploy/postgres-init/**"
          target: /mnt/data/hotel-management-system
          strip_components: 0
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          # The VM's link to ghcr.io is slow and occasionally stalls on a large layer. The
          # action's default command_timeout is 10m, which the pull kept blowing past — killing
          # the deploy *before* `up -d` and leaving the VM on stale images. Raise the ceiling and
          # retry the pull so a single stalled layer no longer fails the whole release.
          command_timeout: 40m
          script: |
            set -eu
            cd /mnt/data/hotel-management-system

            # Pull ALL services every deploy (not just changed ones): earlier deploys failed
            # mid-pull, so the VM may be behind on several images — a full pull is self-healing
            # and converges it to :latest. Layers already present are skipped, so once caught up
            # this is fast. Each attempt is capped by `timeout` so a stall is retried, not fatal.
            for attempt in 1 2 3; do
              echo "== docker compose pull (attempt $attempt) =="
              if timeout 600 docker compose pull; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "ERROR: docker compose pull failed after 3 attempts" >&2
                exit 1
              fi
              echo "pull stalled/failed; retrying in 15s..."
              sleep 15
            done

            docker compose up -d --remove-orphans

            # Fail loudly if anything crashed on start, so a broken deploy shows red instead of
            # silently leaving old/half-updated containers running.
            sleep 15
            if [ -n "$(docker compose ps --status exited --quiet)" ]; then
              echo "ERROR: one or more services exited after deploy:" >&2
              docker compose ps >&2
              exit 1
            fi
            docker compose ps
