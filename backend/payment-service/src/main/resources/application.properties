server.port=8084

spring.application.name=payment-service

spring.datasource.url=jdbc:postgresql://localhost:5432/hms_payment
spring.datasource.username=${DB_USERNAME:hms_user}
spring.datasource.password=${DB_PASSWORD:hms_password}

# schema is owned by Flyway migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Stripe TEST MODE secret key (starts with sk_test_...). Free, no separate mock
# service needed - Stripe's own test mode fully simulates PaymentIntents.
# Get this from https://dashboard.stripe.com/test/apikeys
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_REPLACE_ME}

# Payment Service does not own bookings - it calls Booking Service to mark a
# booking CONFIRMED once Stripe reports the payment succeeded.
booking-service.base-url=${BOOKING_SERVICE_URL:http://localhost:8085}
booking-service.timeout-ms=5000

springdoc.swagger-ui.path=/swagger-ui.html
