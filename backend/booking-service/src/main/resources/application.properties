server.port=8085

spring.application.name=booking-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/hms_booking
spring.datasource.username=${DB_USERNAME:hms_user}
spring.datasource.password=${DB_PASSWORD:hms_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Booking Service does not own room data or money math - it calls
# Room Detail Service (for display info) and Pricing Service (for the quote).
room-detail-service.base-url=${ROOM_DETAIL_SERVICE_URL:http://localhost:8081}
room-detail-service.timeout-ms=3000

pricing-service.base-url=${PRICING_SERVICE_URL:http://localhost:8083}
pricing-service.timeout-ms=3000

# Shared secret for service-to-service calls (e.g. from Payment Service).
# Must match the same value Payment Service sends as X-Internal-Secret.
internal.service-secret=${INTERNAL_SERVICE_SECRET:change-me-in-every-environment}

# Browser (checkout) calls this service directly, so it needs CORS just like
# room/user/pricing services. Comma-separated list of allowed origins.
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

springdoc.swagger-ui.path=/swagger-ui.html

room-service.base-url=${ROOM_SERVICE_URL:http://localhost:8081}
room-service.timeout-ms=3000

user-service.base-url=${USER_SERVICE_URL:http://localhost:8082}
user-service.timeout-ms=3000

# TEMPORARY stopgap admin auth - replace with real Firebase ID token +
# admin custom claim verification. Do not treat this as real security.
admin.shared-secret=${ADMIN_SHARED_SECRET:change-me-in-every-environment}