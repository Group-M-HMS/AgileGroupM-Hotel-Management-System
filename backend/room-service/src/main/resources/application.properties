spring.application.name=hotel-management-system
server.port=8081

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/hotel_management
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# Absolute path to the Firebase service-account JSON, provided at runtime (never committed).
# Empty by default so local/CI builds start without a key (Firebase init is skipped with a warning).
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

# booking-service is the booking system of record; search asks it which rooms are already held.
booking-service.base-url=${BOOKING_SERVICE_URL:http://localhost:8085}
booking-service.timeout-ms=3000
internal.service-secret=${INTERNAL_SERVICE_SECRET:change-me-in-every-environment}
