server.port=8082

spring.application.name=room-detail-service

spring.datasource.url=jdbc:postgresql://localhost:5432/hms_room_detail
spring.datasource.username=${DB_USERNAME:hms_user}
spring.datasource.password=${DB_PASSWORD:hms_password}

# schema is owned by Flyway migrations, not Hibernate auto-DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Sprint 01: Room Service owns base room data (name, description, max_occupancy).
# Room Detail Service calls it to aggregate the full room-details payload.
room-service.base-url=${ROOM_SERVICE_URL:http://localhost:8081}
room-service.timeout-ms=3000

springdoc.swagger-ui.path=/swagger-ui.html