spring.application.name=user-service
server.port=8082

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/hotel_management
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# room-service base URL, used for booking history/itinerary lookups
room.service.base-url=${ROOM_SERVICE_URL:http://localhost:8081}

# Absolute path to the Firebase service-account JSON, provided at runtime (never committed).
# Empty by default so local/CI builds start without a key (Firebase init is skipped with a warning).
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
