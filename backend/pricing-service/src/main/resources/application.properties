server.port=8083

spring.application.name=pricing-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/hms_pricing
spring.datasource.username=${DB_USERNAME:hms_user}
spring.datasource.password=${DB_PASSWORD:hms_password}

# schema is owned by Flyway migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Sprint 01: Room Service owns base_price. Pricing Service calls it to get the
# nightly rate, then owns all money math (subtotal, tax, total) itself.
room-service.base-url=${ROOM_SERVICE_URL:http://localhost:8081}
room-service.timeout-ms=3000

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

springdoc.swagger-ui.path=/swagger-ui.html