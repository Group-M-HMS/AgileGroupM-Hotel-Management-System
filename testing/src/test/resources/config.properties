# NIBM2 Test Environment Configuration

# Base URL of the NIBM2 environment under test
base.url=http://localhost:3000

# Browser: chrome | firefox | edge
browser=chrome

# Run headless (true/false) - useful for CI
headless=false

# Timeouts (seconds)
implicit.wait=5
explicit.wait=15
page.load.timeout=30

# Test data - a seeded account with existing bookings (upcoming + past)
test.existing.user.email=qa.seeded.user@nibm2.test
test.existing.user.password=Passw0rd!23

# Seeded account with ZERO bookings (used for NIBM2-196 empty-state test)
test.zero.bookings.user.email=qa.zero.bookings@nibm2.test
test.zero.bookings.user.password=Passw0rd!23

# A booking ID belonging to a DIFFERENT account, used for the NIBM2-195
# cross-account access-denied negative test
test.other.user.booking.id=OTHER-ACCT-BOOKING-ID

# Stripe test-mode card (official Stripe test number - never a real card)
stripe.test.card.success=4242424242424242
stripe.test.card.decline=4000000000000002
stripe.test.card.expiry=12/34
stripe.test.card.cvc=123

# Screenshot output directory
screenshot.dir=test-output/screenshots
