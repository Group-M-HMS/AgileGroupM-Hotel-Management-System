services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  room-service:
    image: ${IMAGE_PREFIX}-room-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase-service-account.json
    ports:
      - "8081:8081"
    volumes:
      # Real Firebase key lives only on the host (never in git). Place it at
      # ./secrets/firebase-service-account.json next to this compose file.
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    image: ${IMAGE_PREFIX}-user-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      ROOM_SERVICE_URL: http://room-service:8081
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase-service-account.json
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-change-me-in-every-environment}
    ports:
      - "8082:8082"
    volumes:
      # Real Firebase key lives only on the host (never in git). Place it at
      # ./secrets/firebase-service-account.json next to this compose file.
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      room-service:
        condition: service_started

  pricing-service:
    image: ${IMAGE_PREFIX}-pricing-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      ROOM_SERVICE_URL: http://room-service:8081
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      room-service:
        condition: service_started

  booking-service:
    image: ${IMAGE_PREFIX}-booking-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      ROOM_SERVICE_URL: http://room-service:8081
      ROOM_DETAIL_SERVICE_URL: http://room-service:8081
      PRICING_SERVICE_URL: http://pricing-service:8083
      USER_SERVICE_URL: http://user-service:8082
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-change-me-in-every-environment}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase-service-account.json
    ports:
      - "8085:8085"
    volumes:
      # Real Firebase key lives only on the host (never in git). Place it at
      # ./secrets/firebase-service-account.json next to this compose file.
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      room-service:
        condition: service_started
      pricing-service:
        condition: service_started

  payment-service:
    image: ${IMAGE_PREFIX}-payment-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      BOOKING_SERVICE_URL: http://booking-service:8085
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_REPLACE_ME}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-change-me-in-every-environment}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      booking-service:
        condition: service_started

  frontend:
    image: ${IMAGE_PREFIX}-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - room-service
      - pricing-service

volumes:
  postgres-data:
